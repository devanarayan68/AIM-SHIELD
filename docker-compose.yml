version: '3.8'

services:
  aim-shield-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - aim-shield-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  aim-shield-frontend:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./frontend_advanced.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - aim-shield-backend
    restart: unless-stopped

volumes:
  aim-shield-data:
