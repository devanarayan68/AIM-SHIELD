name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run linting
      run: |
        pip install pylint
        pylint backend/*.py --disable=C0111,R0913 --fail-under=7.0 || true
    
    - name: Run unit tests
      run: |
        pytest backend/ --cov=backend --cov-report=xml || true

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t aim-shield:${{ github.sha }} .
        docker build -t aim-shield:latest .
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push Docker image
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag aim-shield:latest ${{ secrets.DOCKER_USERNAME }}/aim-shield:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/aim-shield:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Kubernetes
      if: ${{ secrets.KUBECONFIG }}
      run: |
        mkdir -p $HOME/.kube
        echo ${{ secrets.KUBECONFIG }} | base64 -d > $HOME/.kube/config
        kubectl apply -f k8s-deployment.yaml
        kubectl rollout status deployment/aim-shield-backend
